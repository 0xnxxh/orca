<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orca Fleet — Canvas</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./control-room-tokens.css" />
    <link rel="stylesheet" href="./fleet-canvas.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <span class="brand">Fleet</span>
        <nav class="tabs" aria-label="Fleet views">
          <a href="./fleet-map.html">Map</a>
          <a href="./fleet-strips.html">Strips</a>
          <a href="./mission-control.html">Mission Control</a>
          <a href="./fleet-hexmap.html">Hexmap</a>
          <a href="./fleet-terminal-wall.html">Terminal Wall</a>
          <a href="./fleet-triage.html">Triage</a>
          <a class="is-active" href="./fleet-canvas.html" aria-current="page">Canvas</a>
        </nav>
        <div class="chips" id="chips"></div>
        <div class="topright">
          <input
            id="search"
            class="search"
            type="search"
            autocomplete="off"
            spellcheck="false"
            aria-label="Filter the fleet"
          />
          <span class="accounting" id="accounting"></span>
        </div>
      </header>

      <div class="stage" id="stage">
        <svg class="canvas" id="canvas" data-zoom="mid" aria-label="Fleet canvas">
          <defs>
            <pattern id="dotgrid" width="44" height="44" patternUnits="userSpaceOnUse">
              <circle class="grid-dot" cx="1" cy="1" r="1" />
            </pattern>
          </defs>
          <g id="world">
            <rect class="grid" x="-5000" y="-5000" width="10000" height="10000" fill="url(#dotgrid)" />
            <g id="orbits"></g>
            <g id="lineage"></g>
            <g id="systems"></g>
          </g>
        </svg>

        <p class="empty" id="empty" hidden></p>

        <div class="viewtools">
          <button class="vt" id="fit" type="button">Fit</button>
          <button class="vt" id="zoomreset" type="button" aria-label="Reset zoom to 100%">100%</button>
        </div>
      </div>

      <footer class="whisper" id="whisper"></footer>
    </main>

    <aside class="panel" id="panel" aria-label="Agent detail" aria-hidden="true"></aside>
    <div class="tip" id="tip" role="tooltip" hidden></div>

    <script src="../agent-viewer-alternatives/actual-agent-activity.js"></script>
    <script src="./fleet-state-synthesis.js"></script>
    <script src="./fleet-canvas.js"></script>
  </body>
</html>
