<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orca Fleet — Wall</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./control-room-tokens.css" />
    <link rel="stylesheet" href="./fleet-terminal-wall.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <span class="brand">Fleet</span>
        <nav class="tabs" aria-label="Fleet views">
          <a href="./fleet-map.html">Map</a>
          <a href="./fleet-strips.html">Strips</a>
          <a href="./mission-control.html">Mission Control</a>
          <a href="./fleet-hexmap.html">Hexmap</a>
          <a class="is-active" href="./fleet-terminal-wall.html" aria-current="page">Wall</a>
        </nav>
        <div class="chips" id="chips"></div>
        <div class="topright">
          <input
            id="search"
            class="search"
            type="search"
            autocomplete="off"
            spellcheck="false"
            aria-label="Filter the fleet"
          />
          <span class="accounting" id="accounting"></span>
        </div>
      </header>

      <div class="wall" id="wall"></div>

      <footer class="whisper" id="whisper"></footer>
    </main>

    <aside class="panel" id="panel" aria-label="Agent detail" aria-hidden="true"></aside>
    <div class="tip" id="tip" role="tooltip" hidden></div>

    <script src="../agent-viewer-alternatives/actual-agent-activity.js"></script>
    <script src="./fleet-state-synthesis.js"></script>
    <script src="./fleet-terminal-wall.js"></script>
  </body>
</html>
