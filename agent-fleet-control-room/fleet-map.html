<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orca Fleet — Containment Map</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./control-room-tokens.css" />
    <link rel="stylesheet" href="./fleet-map.css" />
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true">
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5" /><path d="m20.5 20.5-4-4" /></symbol>
    </svg>

    <main class="shell">
      <header class="topbar">
        <h1 class="brand">Fleet</h1>
        <nav class="viewtabs" aria-label="Fleet views">
          <a class="is-active" href="./fleet-map.html" aria-current="page">Map</a>
          <a href="./fleet-strips.html">Strips</a>
          <a href="./mission-control.html">Mission Control</a>
        </nav>
        <label class="search">
          <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
          <input id="search" type="search" placeholder="Search agents, worktrees, states…" autocomplete="off" spellcheck="false" aria-label="Search the fleet" />
          <kbd id="search-kbd">⌘K</kbd>
        </label>
        <span class="match-chip" id="match-chip" hidden></span>
        <p class="accounting" id="accounting"></p>
      </header>

      <section class="dials" id="dials" aria-label="Fleet pulse"></section>

      <div class="workspace">
        <section class="canvas" aria-label="Containment map">
          <div class="bands" id="bands"></div>
          <svg class="lineage" id="lineage" aria-hidden="true"></svg>
          <footer class="legend" id="legend"></footer>
        </section>

        <aside class="detail" id="detail" aria-live="polite"></aside>
      </div>
    </main>

    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

    <script src="../agent-viewer-alternatives/actual-agent-activity.js"></script>
    <script src="./fleet-state-synthesis.js"></script>
    <script src="./fleet-map.js"></script>
  </body>
</html>
